services:
  mysql:
    image: mysql:8.0
    container_name: wp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_net

  wordpress:
    image: wordpress:php8.4-fpm
    container_name: wp_php
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp_net

  nginx:
    image: nginx:stable
    container_name: wp_nginx
    depends_on:
      - wordpress
    ports:
      - "80:80"
    volumes:
      - wp_data:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - wp_net

  site2_mysql:
    image: mysql:8.0
    container_name: site2_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SITE2_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SITE2_MYSQL_DATABASE}
      MYSQL_USER: ${SITE2_MYSQL_USER}
      MYSQL_PASSWORD: ${SITE2_MYSQL_PASSWORD}
    volumes:
      - site2_db_data:/var/lib/mysql
    networks:
      - site2_net

  site2_wordpress:
    image: wordpress:php8.4-fpm
    container_name: site2_wordpress
    depends_on:
      - site2_mysql
    environment:
      WORDPRESS_DB_HOST: site2_mysql:3306
      WORDPRESS_DB_USER: ${SITE2_MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${SITE2_MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${SITE2_MYSQL_DATABASE}
    volumes:
      - site2_wp_data:/var/www/html
    networks:
      - site2_net

  site2_nginx:
    image: nginx:stable
    container_name: site2_nginx
    depends_on:
      - site2_wordpress
    ports:
      - "8081:80"
    volumes:
      - site2_wp_data:/var/www/html
      - ./site2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site2/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - site2_net

  site3_mysql:
    image: mysql:8.0
    container_name: site3_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SITE3_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SITE3_MYSQL_DATABASE}
      MYSQL_USER: ${SITE3_MYSQL_USER}
      MYSQL_PASSWORD: ${SITE3_MYSQL_PASSWORD}
    volumes:
      - site3_db_data:/var/lib/mysql
    networks:
      - site3_net

  site3_wordpress:
    image: wordpress:php8.4-fpm
    container_name: site3_wordpress
    depends_on:
      - site3_mysql
    environment:
      WORDPRESS_DB_HOST: site3_mysql:3306
      WORDPRESS_DB_USER: ${SITE3_MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${SITE3_MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${SITE3_MYSQL_DATABASE}
    volumes:
      - site3_wp_data:/var/www/html
    networks:
      - site3_net

  site3_nginx:
    image: nginx:stable
    container_name: site3_nginx
    depends_on:
      - site3_wordpress
    ports:
      - "8082:80"
    volumes:
      - site3_wp_data:/var/www/html
      - ./site3/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site3/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - site3_net

volumes:
  db_data:
  wp_data:
  site2_db_data:
  site2_wp_data:
  site3_db_data:
  site3_wp_data:

networks:
  wp_net:
  site2_net:
  site3_net:
